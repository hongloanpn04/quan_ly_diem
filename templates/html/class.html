<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/Logo_PTIT_University.png?v=1">

    <title>Quản lý lớp học</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                🏫 Cổng Giảng Viên: Quản Lý Lớp Học
            </a>
        </div>
    </nav>


    <main class="container">

        <!-- QUAY LẠI -->
        <div class="mb-3">
            <a href="index.html" class="btn btn-outline-secondary btn-sm">
                ⬅ Quay lại danh sách lớp
            </a>
        </div>


        <!-- THÔNG TIN LỚP -->
        <div class="card shadow-sm mb-4 border-primary">
            <div class="card-body">

                <div class="row align-items-center">

                    <div class="col-md-5">

                        <h3 class="fw-bold text-primary mb-1">
                            Lớp:
                            <span id="maLop"></span>
                        </h3>

                        <span class="badge bg-secondary">
                            Sĩ số:
                            <span id="siSo">0</span>
                            Sinh viên
                        </span>

                    </div>


                    <div class="col-md-7">

                        <div class="d-flex align-items-center
                                    justify-content-md-end
                                    mt-3 mt-md-0">

                            <label class="fw-bold me-2 text-nowrap">
                                📚 Nhập điểm cho Môn:
                            </label>

                            <select
                                id="monHoc"
                                class="form-select w-auto me-2 fw-bold"
                            >
                            </select>

                        </div>

                    </div>

                </div>

            </div>
        </div>


        <!-- TÌM KIẾM + THÊM SINH VIÊN -->
        <div class="d-flex justify-content-between
                    align-items-center mb-3">

            <div class="d-flex w-50">

                <input
                    type="text"
                    id="searchInput"
                    class="form-control me-2"
                    placeholder="Tìm theo tên hoặc MSSV..."
                >

                <button
                    class="btn btn-primary"
                    onclick="timSinhVien()"
                >
                    Tìm
                </button>

                <button
                    class="btn btn-secondary ms-2"
                    onclick="boLoc()"
                >
                    Bỏ lọc
                </button>

            </div>


            <button
                type="button"
                class="btn btn-success"
                data-bs-toggle="modal"
                data-bs-target="#addStudentModal"
            >
                + Thêm Sinh Viên Mới
            </button>

        </div>


        <!-- SỔ ĐIỂM -->
        <div class="card shadow-sm mb-4">

            <div class="card-header bg-dark text-white
                        d-flex justify-content-between
                        align-items-center">

                <span class="fw-bold">
                    📝 Sổ Điểm:
                    <span id="tenMon"></span>
                    (<span id="maMon"></span>)
                </span>

                <button
                    class="btn btn-warning btn-sm fw-bold"
                    onclick="luuDiem()"
                >
                    💾 Lưu Toàn Bộ Bảng Điểm
                </button>

            </div>


            <div class="card-body p-0">

                <div class="table-responsive">

                    <table
                        class="table table-bordered
                               table-hover text-center
                               align-middle mb-0"
                    >

                        <thead class="table-secondary">

                            <tr>
                                <th style="width: 50px;">STT</th>

                                <th style="width: 140px;">
                                    MSSV
                                </th>

                                <th class="text-start">
                                    Họ và Tên
                                </th>

                                <th style="width: 150px;">
                                    Điểm Quá Trình (40%)
                                </th>

                                <th style="width: 150px;">
                                    Điểm Cuối Kỳ (60%)
                                </th>

                                <th style="width: 120px;">
                                    Tổng Kết
                                </th>

                                <th style="width: 130px;">
                                    Xếp Loại
                                </th>

                                <th style="width: 90px;">
                                    Thao tác
                                </th>
                            </tr>

                        </thead>


                        <tbody id="studentTableBody">

                            <!-- JavaScript sẽ tạo dữ liệu ở đây -->

                        </tbody>

                    </table>

                </div>

            </div>


            <div class="card-footer bg-light text-end">

                <button
                    class="btn btn-warning fw-bold"
                    onclick="luuDiem()"
                >
                    💾 Lưu Toàn Bộ Bảng Điểm
                </button>

            </div>

        </div>

    </main>


    <!-- MODAL THÊM SINH VIÊN -->

    <div
        class="modal fade"
        id="addStudentModal"
        tabindex="-1"
    >

        <div class="modal-dialog">

            <div class="modal-content">

                <form id="addStudentForm">

                    <div class="modal-header bg-success text-white">

                        <h5 class="modal-title">
                            Thêm Sinh Viên Mới
                        </h5>

                        <button
                            type="button"
                            class="btn-close btn-close-white"
                            data-bs-dismiss="modal"
                        ></button>

                    </div>


                    <div class="modal-body">

                        <div class="mb-3">

                            <label class="form-label">
                                Mã Số Sinh Viên (MSSV):
                            </label>

                            <input
                                type="text"
                                id="mssv"
                                class="form-control"
                                placeholder="VD: N24DCCN099"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Họ và Tên:
                            </label>

                            <input
                                type="text"
                                id="hoTen"
                                class="form-control"
                                placeholder="VD: Nguyễn Hoàng An"
                                required
                            >

                        </div>

                    </div>


                    <div class="modal-footer">

                        <button
                            type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal"
                        >
                            Hủy
                        </button>

                        <button
                            type="submit"
                            class="btn btn-success"
                        >
                            Thêm Sinh Viên
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/class.js"></script>

</body>
</html>
